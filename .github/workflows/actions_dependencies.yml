name: update actions dependencies
on:

  schedule:
    - cron:  '0 0 15 * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:
    branches:
      - development

jobs:
  update-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: development
          persist-credentials: false

      - name: Run GitHub Actions Version Updater
        uses: saadmk11/github-actions-version-updater@v0.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip_pull_request: true

      - name: Create and apply changes
        run: |
          git diff > changes.patch
          git apply --allow-empty changes.patch
          rm -rf changes.patch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: development
          branch: actions-dependency-update
          delete-branch: true
          title: Actions Dependency Updates
          commit-message: Actions Dependency updates
